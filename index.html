<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GinsPicks - Select Week</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      color: #1e3a8a;
      margin-bottom: 5px;
    }
    p.subtitle {
      color: #64748b;
      font-size: 0.95em;
      margin-bottom: 25px;
    }
    .week-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-week {
      display: block;
      padding: 14px;
      background-color: #1e3a8a;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      transition: background-color 0.2s;
    }
    .btn-week:hover {
      background-color: #1d4ed8;
    }
    .btn-disabled {
      display: block;
      padding: 14px;
      background-color: #e2e8f0;
      color: #94a3b8;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🏈 GinsPicks</h1>
  <p class="subtitle">Select a week to make or view your picks</p>

  <div class="week-grid">
    <!-- ACTIVE WEEKS -->
    <a href="week1.html" class="btn-week">Week 1 Picks</a>
    <a href="week2.html" class="btn-week">Week 2 Picks</a>

    <!-- UPCOMING WEEKS (DISABLED) -->
    <div class="btn-disabled">Week 3 (Coming Soon)</div>
    <div class="btn-disabled">Week 4 (Coming Soon)</div>
  </div>
</div>

</body>
</html>
